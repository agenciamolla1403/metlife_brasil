<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muito Além do Jogo | MetLife 2026</title>
  <script src="/assets/auth.js"></script>
  <link rel="stylesheet" href="/assets/header.css" />
  <link rel="stylesheet" href="/assets/breadcrumb.css" />
  <link rel="stylesheet" href="/assets/footer.css" />
  <style>
    :root {
      --navy: #003B5C;
      --blue: #2DB5DF;
      --teal: #27C7BD;
      --green: #50E596;
      --light: #EEF6F8;
      --muted: #5B7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--navy);
      line-height: 1.45;
    }
    .stub-wrap {
      min-height: calc(100vh - var(--mlh-header-h, 60px) - 56px - 40px);
      display: grid;
      place-items: center;
      padding: 80px 24px;
    }
    .stub-card {
      max-width: 640px;
      background: white;
      border-radius: 28px;
      padding: 56px 48px;
      box-shadow: 0 18px 40px rgba(0, 59, 92, 0.12);
      text-align: center;
    }
    .stub-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 20px;
    }
    .stub-eyebrow {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 165, 36, 0.18);
      color: #B26B05;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin: 0 0 16px;
      line-height: 1;
      letter-spacing: -1px;
    }
    p {
      font-size: 17px;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 28px;
    }
    .back-link {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--navy);
      color: white;
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease;
    }
    .back-link:hover {
      transform: translateY(-2px);
    }
    footer.site-footer {
      padding: 40px 24px;
      background: var(--navy);
      color: white;
      text-align: center;
      font-size: 13px;
    }
    .brand-footer-row {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .brand-logo-footer { height: 22px; opacity: 0.9; }
    .brand-footer-text { font-size: 11px; opacity: 0.7; margin: 0; }
  </style>
</head>
<body>
  <div class="page-subbar">
    <div class="page-subbar-inner">
      <span class="crumb"><a href="/">Central do Cliente</a> &nbsp;/&nbsp; <span class="crumb-group">Operação</span> &nbsp;/&nbsp; <strong>Muito Além do Jogo</strong></span>
    </div>
  </div>

  <div class="stub-wrap">
    <div class="stub-card">
      <div class="stub-icon">🚧</div>
      <span class="stub-eyebrow">Em construção</span>
      <h1>Muito Além do Jogo</h1>
      <p>Essa sessão está sendo desenhada agora. Em breve você vai encontrar aqui o conteúdo completo dessa ativação.</p>
      <a class="back-link" href="/">← Voltar pra Central do Cliente</a>
    </div>
  </div>

  <footer class="site-footer">
    <p style="margin: 0;">MetLife Brasil 2026 · Hub interno Molla</p>
    <div class="brand-footer-row">
      <img src="/img/logo_molla.svg" alt="Molla" class="brand-logo-footer" />
      <p class="brand-footer-text">Agência Molla</p>
    </div>
  </footer>

  <script src="/assets/header.js"></script>
</body>
</html>
