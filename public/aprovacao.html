<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprovação de Peças | MetLife Brasil 2026</title>
  <meta name="description" content="Submissão, comentários e aprovação de artes e vídeos por campanha — MetLife Brasil 2026." />
  <script src="/assets/auth.js"></script>
  <link rel="stylesheet" href="/assets/aprovacao.css" />
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/">
        <span class="brand-dot"></span>
        <span>MetLife Brasil</span>
      </a>
      <span class="crumb" id="crumb"></span>
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="userChip"></span>
      <button class="btn-ghost" id="btnChangeUser" type="button" title="Trocar identificação">Trocar</button>
      <button class="btn-ghost" id="btnLogout" type="button">Sair</button>
    </div>
  </div>

  <div class="page-header">
    <div class="page-header-inner">
      <span class="eyebrow">Aprovação de Peças</span>
      <h1>Fluxo de <strong>Aprovação</strong></h1>
      <p class="lede">Crie campanhas, suba artes e vídeos com copy, comente e aprove peça a peça. Cada campanha tem seu próprio mini-dashboard de status.</p>
    </div>
  </div>

  <main id="appContent">
    <!-- Renderizado dinamicamente por aprovacao.js -->
  </main>

  <footer class="page-footer">
    <p><strong>Agência Mollá</strong> × MetLife Brasil — 2026</p>
  </footer>

  <!-- Supabase SDK + camada de dados (ordem importa) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/config.js"></script>
  <script src="/assets/supabase-store.js"></script>
  <script src="/assets/aprovacao.js"></script>
</body>
</html>
